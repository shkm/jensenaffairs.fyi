    :root {
      --green: #76b900;

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {

      flex-direction: column;
      min-height: 100svh;
      background:

        repeating-linear-gradient(135deg, transparent 0 22px, rgb(255 255 255 / 0.025) 22px 23px),

      flex: 1;

      display: grid;
      container-type: inline-size;
      width: min(90vw, 600px, (100svh - 13rem) * 600 / 640);

      transform-origin: 50% 0;
    }
    .jacket > * { grid-area: 1 / 1; }
    .jacket img { width: 100%; height: auto; }
    .count {

      margin: 30cqw 0 0;

      color: #666;
      font: 0.85rem/1.4 ui-monospace, Menlo, monospace;
    }
    footer a { color: var(--green); }
    @keyframes swagger {
      50% { transform: rotate(1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .jacket { animation: none; }
    }
